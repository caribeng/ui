name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Build, Test & Package APF
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (lib, spec, showcase)
        run: |
          node ./node_modules/typescript/bin/tsc -p packages/ui/tsconfig.lib.json --noEmit
          node ./node_modules/typescript/bin/tsc -p packages/ui/tsconfig.spec.json --noEmit
          node ./node_modules/typescript/bin/tsc -p apps/showcase/tsconfig.app.json --noEmit

      - name: Build all projects (ui, tokens, showcase)
        run: pnpm nx run-many -t build

      - name: Run unit tests
        run: pnpm nx test ui

      - name: Test and build ng add schematics
        run: |
          pnpm nx run ui:test-schematics
          pnpm nx run ui:build-schematics

      - name: Verify npm package (APF dry-run)
        working-directory: dist/packages/ui
        run: npm pack --dry-run
