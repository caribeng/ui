name: Feature request
description: Suggest a new component or an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Why is this useful? How would you use it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or alternatives you considered.
