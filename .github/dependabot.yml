version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    versioning-strategy: increase
    ignore:
      # Tooling con major propio: se mantiene en su major actual para no romper
      # el workspace (Nx, Angular, TypeScript y ng-packagr se actualizan a mano).
      - dependency-name: "@nx/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Los actions se mantienen en su major actual (v4) para no romper los workflows.
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
